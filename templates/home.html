{% extends "base.html" %}
{% block content %}
<h1>Search medicines</h1>

<section class="grid">
  <form action="{{ url_for('search') }}" method="get" class="card">
    <h3>Text search</h3>
    <input type="text" name="q" placeholder="e.g., Dolo 650 or Paracetamol" required>
    <button type="submit">Search</button>
  </form>

  <form action="{{ url_for('image_search') }}" method="post" enctype="multipart/form-data" class="card">
    <h3>Image search</h3>
    <input type="file" name="photo" accept="image/*" capture="environment">
    <button type="submit">Use Photo</button>
    <p class="hint">Tip: clear, well-lit label works best. (OCR is optional)</p>
  </form>
</section>
{% endblock %}
